name: Verify analysis
on:
  push:
  pull_request:
jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python d8b_analysis.py data/dmo_d8b_2026-09-21.csv --output outputs
      - run: python strategy_frontier.py data/dmo_d8b_2026-09-21.csv examples/illustrative_yields.csv --output outputs/ten_year
      - run: python strategy_frontier.py data/dmo_d8b_2026-09-21.csv examples/illustrative_yields.csv --horizon 30 --risk-metric shock_cost --output outputs/thirty_year
